<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <title>PDF Viewer | £nigma to €lectrical</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #07100b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        .viewer-header {

            height: 64px;

            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(7,16,11,0.98);

            border-bottom:
                1px solid rgba(91,255,143,0.25);

            position: sticky;
            top: 0;

            z-index: 1000;
        }


        .viewer-title {

            color: #5bff8f;

            font-size: 17px;

            font-weight: 700;

            white-space: nowrap;
        }


        .back-btn {

            color: #ffffff;

            text-decoration: none;

            border:
                1px solid rgba(91,255,143,0.4);

            padding: 9px 14px;

            border-radius: 8px;

            font-size: 14px;

            white-space: nowrap;
        }


        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {

            position: sticky;

            top: 64px;

            z-index: 900;

            min-height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 9px;

            background:
                rgba(7,16,11,0.97);

            border-bottom:
                1px solid rgba(91,255,143,0.18);

            flex-wrap: wrap;
        }


        .control-btn {

            min-width: 42px;

            height: 38px;

            padding: 0 12px;

            border:
                1px solid rgba(91,255,143,0.4);

            border-radius: 8px;

            background: #0b1710;

            color: #5bff8f;

            font-size: 19px;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;
        }


        .control-btn:active {

            transform: scale(0.94);
        }


        .status {

            min-width: 70px;

            text-align: center;

            color: #ffffff;

            font-size: 13px;
        }


        .divider {

            width: 1px;

            height: 25px;

            background:
                rgba(255,255,255,0.15);
        }


        /* =========================
           PDF VIEWPORT
        ========================= */

        #pdf-container {

            width: 100%;

            min-height:
                calc(100vh - 122px);

            padding: 20px 10px 50px;

            overflow: auto;

            -webkit-overflow-scrolling: touch;

            touch-action: pan-x pan-y pinch-zoom;
        }


        /* =========================
           PDF PAGE
        ========================= */

        .page-wrapper {

            width: max-content;

            margin: 0 auto 24px;

            background: #ffffff;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.45);

            position: relative;

            transform-origin: top left;
        }


        canvas {

            display: block;

            background: #ffffff;

            max-width: none;

            height: auto;
        }


        .page-label {

            text-align: center;

            color:
                rgba(255,255,255,0.55);

            font-size: 12px;

            margin-top: 8px;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 60px 20px;

            color: #5bff8f;

            font-size: 16px;
        }


        .error {

            text-align: center;

            padding: 60px 20px;

            color: #ff7777;

            font-size: 16px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .viewer-header {

                height: 58px;

                padding: 0 12px;
            }


            .viewer-title {

                font-size: 14px;
            }


            .back-btn {

                padding: 8px 10px;

                font-size: 13px;
            }


            .toolbar {

                top: 58px;

                gap: 6px;

                padding: 8px;
            }


            .control-btn {

                min-width: 38px;

                height: 36px;

                padding: 0 9px;
            }


            .status {

                min-width: 58px;

                font-size: 12px;
            }


            #pdf-container {

                min-height:
                    calc(100vh - 116px);

                padding:
                    14px 5px 35px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="viewer-header">

        <div class="viewer-title">
            ⚡ £nigma to €lectrical
        </div>

        <a
            href="index.html"
            class="back-btn">

            ← Back

        </a>

    </header>


    <!-- =========================
         TOOLBAR
    ========================= -->

    <div class="toolbar">

        <button
            class="control-btn"
            id="zoomOut">

            −

        </button>


        <span
            class="status"
            id="zoomLevel">

            100%

        </span>


        <button
            class="control-btn"
            id="zoomIn">

            +

        </button>


        <button
            class="control-btn"
            id="zoomReset">

            ↺

        </button>


        <div class="divider"></div>


        <span
            class="status"
            id="pageStatus">

            Page 0 / 0

        </span>

    </div>


    <!-- =========================
         PDF
    ========================= -->

    <main id="pdf-container">

        <div
            class="loading"
            id="loading">

            Loading PDF...

        </div>

    </main>


    <!-- =========================
         PDF.JS
    ========================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module">
    </script>


    <script type="module">

        import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


        /* =========================
           URL
        ========================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const pdfFile =
            params.get("pdf");


        /* =========================
           ELEMENTS
        ========================= */

        const container =
            document.getElementById(
                "pdf-container"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const zoomLevel =
            document.getElementById(
                "zoomLevel"
            );


        const pageStatus =
            document.getElementById(
                "pageStatus"
            );


        /* =========================
           VARIABLES
        ========================= */

        let pdfDocument = null;

        let currentZoom = 1;

        let baseScale = 1;


        /*
         * Higher internal resolution.
         * This makes text sharper.
         */

        const renderQuality = 2;


        /* =========================
           LOAD PDF
        ========================= */

        async function loadPDF() {

            if (!pdfFile) {

                loading.textContent =
                    "PDF not found.";

                loading.className =
                    "error";

                return;
            }


            try {

                pdfDocument =
                    await pdfjsLib
                        .getDocument(pdfFile)
                        .promise;


                loading.remove();


                /*
                 * Fit page to mobile screen
                 * while keeping high render quality.
                 */

                const firstPage =
                    await pdfDocument.getPage(1);


                const originalViewport =
                    firstPage.getViewport({
                        scale: 1
                    });


                const availableWidth =
                    Math.min(
                        window.innerWidth - 20,
                        900
                    );


                baseScale =
                    availableWidth /
                    originalViewport.width;


                currentZoom = 1;


                updateZoom();


                updatePageStatus();


                await renderPDF();

            }

            catch (error) {

                console.error(error);

                loading.textContent =
                    "Unable to load PDF.";

                loading.className =
                    "error";

            }

        }


        /* =========================
           RENDER PDF
        ========================= */

        async function renderPDF() {

            container.innerHTML = "";


            for (
                let pageNumber = 1;
                pageNumber <= pdfDocument.numPages;
                pageNumber++
            ) {

                const page =
                    await pdfDocument.getPage(
                        pageNumber
                    );


                /*
                 * Display scale
                 */

                const displayScale =
                    baseScale *
                    currentZoom;


                /*
                 * High-quality render scale
                 */

                const renderScale =
                    displayScale *
                    renderQuality;


                const viewport =
                    page.getViewport({
                        scale: renderScale
                    });


                const displayViewport =
                    page.getViewport({
                        scale: displayScale
                    });


                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "page-wrapper";


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                const context =
                    canvas.getContext(
                        "2d",
                        {
                            alpha: false
                        }
                    );


                /*
                 * Internal canvas =
                 * high resolution
                 */

                canvas.width =
                    Math.ceil(
                        viewport.width
                    );


                canvas.height =
                    Math.ceil(
                        viewport.height
                    );


                /*
                 * Display size =
                 * normal CSS size
                 */

                canvas.style.width =
                    displayViewport.width +
                    "px";


                canvas.style.height =
                    displayViewport.height +
                    "px";


                wrapper.appendChild(canvas);


                container.appendChild(wrapper);


                await page.render({

                    canvasContext:
                        context,

                    viewport:
                        viewport

                }).promise;


                const label =
                    document.createElement(
                        "div"
                    );


                label.className =
                    "page-label";


                label.textContent =
                    "Page " +
                    pageNumber +
                    " / " +
                    pdfDocument.numPages;


                container.appendChild(label);

            }

        }


        /* =========================
           ZOOM IN
        ========================= */

        document.getElementById(
            "zoomIn"
        ).addEventListener(
            "click",
            async function () {

                if (currentZoom < 3) {

                    currentZoom += 0.25;

                    updateZoom();

                    await renderPDF();

                }

            }
        );


        /* =========================
           ZOOM OUT
        ========================= */

        document.getElementById(
            "zoomOut"
        ).addEventListener(
            "click",
            async function () {

                if (currentZoom > 0.5) {

                    currentZoom -= 0.25;

                    updateZoom();

                    await renderPDF();

                }

            }
        );


        /* =========================
           RESET
        ========================= */

        document.getElementById(
            "zoomReset"
        ).addEventListener(
            "click",
            async function () {

                currentZoom = 1;

                updateZoom();

                await renderPDF();

            }
        );


        /* =========================
           ZOOM TEXT
        ========================= */

        function updateZoom() {

            zoomLevel.textContent =
                Math.round(
                    currentZoom * 100
                ) + "%";

        }


        /* =========================
           PAGE COUNT
        ========================= */

        function updatePageStatus() {

            pageStatus.textContent =
                "Pages " +
                pdfDocument.numPages;

        }


        /* =========================
           START
        ========================= */

        loadPDF();

    </script>


</body>

</html>
